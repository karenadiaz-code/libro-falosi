<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Libro FALOSI - Flipbook</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e9e9e9;font-family:Arial,sans-serif}
#book{width:100vw;height:calc(100vh - 58px);display:flex;align-items:center;justify-content:center}
#book .page{background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}
#book img{width:100%;height:100%;object-fit:contain;display:block}
.toolbar{height:58px;display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;box-shadow:0 -2px 10px rgba(0,0,0,.12);position:relative;z-index:5}
button{border:0;border-radius:8px;padding:9px 15px;background:#222;color:#fff;cursor:pointer;font-size:14px}
button:disabled{opacity:.4;cursor:default}
#counter{min-width:90px;text-align:center;color:#444;font-size:14px}
</style>
</head>
<body>
<div id="book"></div>
<div class="toolbar">
<button id="prev">‹ Anterior</button>
<span id="counter">Página 1</span>
<button id="next">Siguiente ›</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>
<script>
const pages = [
  "pages/page-1.jpg",
  "pages/page-2.jpg",
  "pages/page-3.jpg",
  "pages/page-4.jpg",
  "pages/page-5.jpg",
  "pages/page-6.jpg",
  "pages/page-7.jpg",
  "pages/page-8.jpg"
];

const book = document.getElementById('book');
const pageFlip = new St.PageFlip(book, {
  width: 708,
  height: 992,
  size: "stretch",
  minWidth: 280,
  maxWidth: 1000,
  minHeight: 390,
  maxHeight: 1400,
  showCover: true,
  mobileScrollSupport: false,
  useMouseEvents: true,
  flippingTime: 850,
  maxShadowOpacity: 0.55,
  drawShadow: true,
  autoSize: true
});

const pagesHtml = pages.map((src, i) => `
  <div class="page" data-density="${i === 0 || i === pages.length-1 ? 'hard' : 'soft'}">
    <img src="${src}" alt="Página ${i+1}" draggable="false">
  </div>`);

pageFlip.loadFromHTML(pagesHtml.map((x) => {
  const t = document.createElement('div');
  t.innerHTML = x.trim();
  return t.firstElementChild;
}));

function update() {
  const p = pageFlip.getCurrentPageIndex() + 1;
  document.getElementById('counter').textContent = `Página ${Math.min(p, pages.length)} de ${pages.length}`;
  document.getElementById('prev').disabled = p <= 1;
  document.getElementById('next').disabled = p >= pages.length;
}
pageFlip.on('flip', update);
document.getElementById('prev').onclick = () => pageFlip.flipPrev();
document.getElementById('next').onclick = () => pageFlip.flipNext();
window.addEventListener('resize', update);
setTimeout(update, 500);
</script>
</body>
</html>
