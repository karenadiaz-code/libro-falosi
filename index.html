  "pages/FALOSI_LIBRO72.jpg"

const book = document.getElementById("book");

const pageFlip = new St.PageFlip(book, {
  width: 708,
  height: 992,
  size: "stretch",

  minWidth: 280,
  maxWidth: 1200,
  minHeight: 390,
  maxHeight: 1600,

  showCover: true,
  mobileScrollSupport: false,

  flippingTime: 850,

  maxShadowOpacity: 0.55,
  drawShadow: true,
  autoSize: true
});

pageFlip.loadFromImages(pages);
  /* ==========================================
   AYUDA INICIAL PARA USUARIOS DE CELULAR
   ========================================== */

if (window.matchMedia("(pointer: coarse)").matches) {

  const helpOverlay = document.createElement("div");

  helpOverlay.innerHTML = `
    <div class="help-card">
      <div class="help-icon">🔍</div>

      <div class="help-title">
        Toca la página para ampliar y leer
      </div>

      <div class="help-subtitle">
        Desliza para pasar las páginas
      </div>
    </div>
  `;

  helpOverlay.style.cssText = `
    position: fixed;
    inset: 0;
    z-index: 9998;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    background: rgba(0,0,0,0.08);
    animation: helpFadeIn 0.4s ease;
  `;

  const style = document.createElement("style");

  style.textContent = `
    @keyframes helpFadeIn {
      from {
        opacity: 0;
        transform: scale(0.96);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes helpFadeOut {
      from {
        opacity: 1;
      }

      to {
        opacity: 0;
      }
    }

    .help-card {
      background: rgba(255,255,255,0.96);
      padding: 18px 24px;
      border-radius: 16px;
      text-align: center;
      max-width: 280px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.20);
      font-family: Arial, sans-serif;
    }

    .help-icon {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .help-title {
      font-size: 16px;
      font-weight: bold;
      color: #333;
      line-height: 1.3;
    }

    .help-subtitle {
      margin-top: 7px;
      font-size: 13px;
      color: #666;
      line-height: 1.3;
    }
  `;

  document.head.appendChild(style);
  document.body.appendChild(helpOverlay);

  /*
     La indicación desaparece automáticamente
     después de 4 segundos.
  */

  setTimeout(() => {

    helpOverlay.style.animation =
      "helpFadeOut 0.5s ease forwards";

    setTimeout(() => {
      helpOverlay.remove();
    }, 500);

  }, 4000);

}
  /* ================================
   VISTA AMPLIADA EN CELULAR
   ================================ */

if (window.matchMedia("(pointer: coarse)").matches) {

  const zoomOverlay = document.createElement("div");

  zoomOverlay.innerHTML = `
    <div class="zoom-close">×</div>
    <img id="zoomImage" src="" alt="Página ampliada">
  `;

  zoomOverlay.style.cssText = `
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    z-index: 9999;
    display: none;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    touch-action: none;
  `;

  document.body.appendChild(zoomOverlay);

  const zoomImage = zoomOverlay.querySelector("#zoomImage");
  const closeButton = zoomOverlay.querySelector(".zoom-close");

  zoomImage.style.cssText = `
    max-width: 95vw;
    max-height: 95vh;
    width: auto;
    height: auto;
    object-fit: contain;
    transform-origin: center center;
    user-select: none;
    -webkit-user-drag: none;
  `;

  closeButton.style.cssText = `
    position: absolute;
    top: 15px;
    right: 20px;
    z-index: 10000;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: rgba(255,255,255,0.9);
    color: #333;
    font-size: 32px;
    line-height: 38px;
    text-align: center;
    font-family: Arial, sans-serif;
  `;

  let currentScale = 1;
  let startDistance = 0;

  function openZoom(pageIndex) {

    zoomImage.src = pages[pageIndex];

    currentScale = 1;

    zoomImage.style.transform = "scale(1)";

    zoomOverlay.style.display = "flex";
  }

  function closeZoom() {

    zoomOverlay.style.display = "none";

    currentScale = 1;

    zoomImage.style.transform = "scale(1)";
  }

  closeButton.addEventListener("click", closeZoom);

  zoomOverlay.addEventListener("click", function(e) {

    if (e.target === zoomOverlay) {
      closeZoom();
    }

  });

  /* Zoom con dos dedos */

  zoomImage.addEventListener("touchstart", function(e) {

    if (e.touches.length === 2) {

      startDistance = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );

    }

  }, { passive: false });

  zoomImage.addEventListener("touchmove", function(e) {

    if (e.touches.length === 2) {

      e.preventDefault();

      const distance = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );

      if (startDistance > 0) {

        const change = distance / startDistance;

        currentScale = Math.min(
          Math.max(currentScale * change, 1),
          4
        );

        zoomImage.style.transform =
          `scale(${currentScale})`;

        startDistance = distance;
      }
    }

  }, { passive: false });

  /*
     Detectar toque sobre el libro.
     Un toque corto abre la página actual.
  */

  let tapStartX = 0;
  let tapStartY = 0;
  let tapStartTime = 0;

  book.addEventListener("touchstart", function(e) {

    if (e.touches.length !== 1) return;

    tapStartX = e.touches[0].clientX;
    tapStartY = e.touches[0].clientY;
    tapStartTime = Date.now();

  }, { passive: true });

  book.addEventListener("touchend", function(e) {

    if (e.changedTouches.length !== 1) return;

    const endX = e.changedTouches[0].clientX;
    const endY = e.changedTouches[0].clientY;

    const movement = Math.hypot(
      endX - tapStartX,
      endY - tapStartY
    );

    const duration = Date.now() - tapStartTime;

    /*
       Solo consideramos toque si:
       - se movió muy poco
       - duró menos de 350 ms
    */

    if (movement < 15 && duration < 350) {

      const currentPage = pageFlip.getCurrentPageIndex();

      openZoom(currentPage);
    }

  }, { passive: true });

}
